name: Firmware verification

on:
  push:
  pull_request:

jobs:
  firmware-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - projects/environment-controller
          - projects/vehicle-thermal-ecu
    steps:
      - uses: actions/checkout@v4
      - name: Build and run firmware tests
        run: make test
        working-directory: ${{ matrix.project }}
